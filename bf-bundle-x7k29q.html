var RSD_NOTES = {
  Low:'Your answers do not show strong rejection sensitivity right now. Being hurt by rejection is human. If something still feels heavy, trust that and talk to someone.',
  Moderate:'Rejection and criticism hurt you more than you would like at times. That is common, and there is a lot you can do about it.',
  High:'Your answers show a strong pattern of pain after rejection or criticism. Many people with ADHD describe this, but it also appears with anxiety, low self-esteem, painful past experiences, and low mood. It is worth talking through, and an assessment can help sort out the causes.'
};

function computeRSD(a){
  var order=[2,0,1,5,3,4];
  var areas=RSD.areas.map(function(ar,idx){
    var sc=0,t=0,k;
    for(k=1;k<=4;k++){var v=a['s'+(idx*4+k)]; sc+=v; if(v===3)t++;}
    return {i:idx,name:ar.name,score:sc,threes:t,band:sc<=3?'Rarely a sore point':(sc<=7?'Sometimes a sore point':'Often a sore point')};
  });
  var total=0; areas.forEach(function(x){total+=x.score;});
  var band=total<=17?'Low':(total<=35?'Moderate':(total<=53?'High':'Very high'));
  var top=areas.slice().sort(function(x,y){return (y.score-x.score)||(y.threes-x.threes)||(order.indexOf(x.i)-order.indexOf(y.i));}).slice(0,2);
  var styles=RSD.styles.map(function(s){var sum=0; s.items.forEach(function(n){sum+=a['s'+n];}); return {s:s,sum:sum};});
  var ranked=styles.slice().sort(function(x,y){return y.sum-x.sum;});
  var style;
  if(ranked.every(function(x){return x.sum<=3;})) style={kind:'none',label:'no strong reaction style',list:[]};
  else if(ranked[0].sum-ranked[1].sum<=1) style={kind:'mix',label:'a mix of '+ranked[0].s.ger+' and '+ranked[1].s.ger,list:[ranked[0].s,ranked[1].s]};
  else style={kind:'one',label:ranked[0].s.label,list:[ranked[0].s]};
  var hiBand=(band==='High'||band==='Very high');
  var lines=[];
  if(hiBand && (a.A4==='No'||a.A4==='I am not sure')) lines.push('You may find it useful to take an ADHD self-assessment, such as BrainFirst\'s Attention and Executive Function Profile.');
  if(hiBand) lines.push('BrainFirst\'s free anxiety and self-esteem check-ins can show whether those are part of the picture.');
  if(a.A3==='Severely'||a.C5==='Longer than a week') lines.push('The pain you describe has lasted a long time and is getting in the way of your life. Please consider speaking with a doctor or psychiatrist soon.');
  return {areas:areas,total:total,band:band,top:top,styles:styles,style:style,note:hiBand?RSD_NOTES.High:RSD_NOTES[band],lines:lines};
}
function reportRSD(r,a){
  var t1=r.top[0], t2=r.top[1], e1=RSD.areas[t1.i], e2=RSD.areas[t2.i], S=[];

  else learn.push('Your main reaction style is '+r.style.label+'. In practice this looks like: '+r.style.list.map(function(s){return lc(s.looks).replace(/\.$/,'');}).join('; and ')+'.');

  var aff=['Feeling things strongly can also mean you notice other people\'s feelings, care about doing well, and take relationships seriously. Those are real strengths when the pain does not run the show.'];
  r.areas.forEach(function(x){ if(x.score<=3) aff.push(x.name+' is rarely a sore point for you.');});

function safetyBlock(){
  var h='<div class="bf-safety"><p>'+esc(SAFETY)+'</p>';
  if(C.emergencyContacts) h+='<p>'+esc(C.emergencyContacts).replace(/\n/g,'<br>')+'</p>';
  return h+'</div>';
}
function viewDone(){
  var first=(S.contact.name||'').trim().split(/\s+/)[0];
  var h='<div class="bf-card"><h2 class="bf-q" tabindex="-1" data-focus>Thank you'+(first?', '+esc(first):'')+'</h2>';
  h+='<p>Your answers have been received. Your personal report will be ready within 48 hours, followed by your one-on-one session with the founder of BrainFirst Nigeria.</p>';
  if(C.bookingLink) h+='<p><a class="bf-btn" href="'+esc(C.bookingLink)+'" target="_blank" rel="noopener">Book your one-on-one session</a></p>';
  if(S.local) h+='<p class="bf-small">Your answers are ready. Save them and send the file to '+esc(C.contactEmail)+'.</p><p><button class="bf-btn alt" data-act="download">Save my answers</button></p>';
  h+=safetyBlock();
  h+='<p class="bf-small" style="margin-top:1.4rem">'+esc(DISCLAIMER)+'</p></div>';
  if(PREVIEW){
    S.queue.forEach(function(pid){var r=S.results[pid]; if(r) h+='<div class="bf-card bf-report"><p class="bf-small">Owner preview (not shown to clients)</p>'+repHTML(r.report)+'</div>';});
  }
  return h;
}

/* ---------- submit ---------- */
function freeText(pid,a){
  var ids = pid==='aefp'?['A7','A9','A10']:['A5','C1','C2','C3','C4'];
  return ids.map(function(id){return a[id]||'';}).join(' ');
}
function buildPayload(pid){
  var a=S.ans[pid], r, rep, sm;
  if(pid==='aefp'){r=computeAEFP(a); rep=reportAEFP(r,a); sm=aefpSummary(r);}
  else {r=computeRSD(a); rep=reportRSD(r,a); sm=rsdSummary(r);}
  return {submittedAt:new Date().toISOString(),product:pid,productTitle:PROD[pid].title,name:S.contact.name.trim(),email:S.contact.email.trim(),
    researchConsent:!!S.consent.research,reviewFirst:DISTRESS.test(freeText(pid,a)),summary:sm,answers:a,reportText:repText(rep),report:rep};
}
function post(p){
  if(!C.submitEndpoint){S.local=true; if(window.console) console.warn('BrainFirst: submitEndpoint is empty, answers were not sent anywhere.'); return Promise.resolve();}
  var body=clone(p); delete body.report;
  return fetch(C.submitEndpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
}
function doSubmit(pid){
  var p=buildPayload(pid); S.results[pid]=p;
  post(p).then(function(){
    S.sendState=''; S.i++;
    if(S.i>=S.steps.length) S.view='done';
    render();
  }).catch(function(){S.sendState='error'; render();});
}
function download(){
  var data=S.queue.map(function(pid){var x=clone(S.results[pid]); delete x.report; return x;});
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='brainfirst-answers.json'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

/* ---------- render and events ---------- */
function render(){
  var h = S.view==='landing' ? viewLanding() : (S.view==='done' ? viewDone() : viewStep());
  root.innerHTML='<div class="bf-wrap">'+h+'</div>';
  if(S.first){S.first=false; return;}
  var r=root.getBoundingClientRect(); if(r.top<0) root.scrollIntoView();
  var f=root.querySelector('[data-focus]'); if(f && f.focus) f.focus({preventScroll:true});
}
function go(d){
  S.err='';
  if(d<0){ do{S.i--;}while(S.i>0 && S.steps[S.i].t==='intro' && S.steps[S.i].key!=='next'); }
  else S.i++;
  render();
}
function advanceSoon(st){setTimeout(function(){ if(S.view==='run' && S.steps[S.i]===st) go(1); },260);}

function onNext(){
  var st=S.steps[S.i];
  if(!st || st.t==='submit') return;
  if(st.t==='consent'){ if(!S.consent.agree){S.err='Please tick the box to agree before you continue.'; return render();} }
  if(st.t==='contact'){
    if(!S.contact.name.trim()){S.err='Please enter your name.'; return render();}
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(S.contact.email.trim())){S.err='Please enter a valid email address.'; return render();}
  }
  if(st.t==='multi'){ var v=S.ans[st.pid][st.id]||[]; if(!v.length){S.err='Choose at least one option, or go back.'; return render();} }
  if(st.t==='text'){
    var t=(S.ans[st.pid][st.id]||'').trim();
    if(!t && !(st.optional||st.skip)){S.err='Please write a few words before you continue.'; return render();}
    S.ans[st.pid][st.id]=t;
  }
  go(1);
}
root.addEventListener('click',function(e){
  var b=e.target.closest?e.target.closest('[data-act]'):null; if(!b||!root.contains(b)) return;
  var act=b.getAttribute('data-act'), st=S.steps[S.i];
  if(act==='start'){ return startRun(['aefp','rsd']); }
  if(act==='unlock'){ var inp=document.getElementById('bf-code'); if(!tryCode(inp&&inp.value)){S.codeErr='That code was not recognised. Check it and try again.'; render();} return; }
  if(act==='download') return download();
  if(act==='retry'){S.sendState=''; return render();}
  if(act==='back'){ if(S.i===0){S.view='landing'; S.err=''; return render();} return go(-1); }
  if(act==='next') return onNext();
  if(!st) return;
  if(act==='skip'){ S.ans[st.pid][st.id]=(st.t==='multi'?[]:null); return go(1); }
  if(act==='pick'){
    var v=b.getAttribute('data-v');
    if(st.t==='scale') S.ans[st.pid][st.id]=(v==='dk'?'dk':parseInt(v,10));
    else S.ans[st.pid][st.id]=st.o[parseInt(v,10)];
    S.err=''; render(); return advanceSoon(st);
  }
  if(act==='toggle'){
    var o=st.o[parseInt(b.getAttribute('data-v'),10)], arr=S.ans[st.pid][st.id]||[], ix=arr.indexOf(o);
    if(ix>-1) arr.splice(ix,1); else if(arr.length>=st.max){S.err='You can choose up to '+st.max+'.'; S.ans[st.pid][st.id]=arr; return render();} else arr.push(o);
    S.ans[st.pid][st.id]=arr; S.err=''; return render();
  }
});
root.addEventListener('input',function(e){
  var t=e.target, st=S.steps[S.i];
  if(t.id==='bf-name') S.contact.name=t.value;
  else if(t.id==='bf-email') S.contact.email=t.value;
  else if(t.id==='bf-text' && st){
    S.ans[st.pid][st.id]=t.value;
    var nb=root.querySelector('[data-act="next"]'); if(nb) nb.textContent=((st.optional||st.skip)&&!t.value.trim())?'Skip':'Next';
  }
});
root.addEventListener('change',function(e){
  if(e.target.id==='bf-agree') S.consent.agree=e.target.checked;
  if(e.target.id==='bf-research') S.consent.research=e.target.checked;
});
root.addEventListener('keydown',function(e){
  var st=S.view==='run'?S.steps[S.i]:null; if(!st) return;
  if(st.t==='scale' && /^[0-3]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey){
    S.ans[st.pid][st.id]=parseInt(e.key,10); S.err=''; render(); advanceSoon(st); e.preventDefault(); return;
  }
  if(e.key==='Enter' && e.target && (e.target.id==='bf-name'||e.target.id==='bf-email')){e.preventDefault(); onNext();}
});

/* ---------- start ---------- */
if(C.autoStart){ startRun(['aefp','rsd']); } else { render(); }

if(window.__BF_TEST__){window.__bf={computeAEFP:computeAEFP,computeRSD:computeRSD,reportAEFP:reportAEFP,reportRSD:reportRSD,repText:repText,buildSteps:buildSteps};}
})();
</script>
</div>
</main>
